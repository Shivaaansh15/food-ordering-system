# ==========================================================
# Server
# ==========================================================
server.port=8080

# ==========================================================
# MySQL / Hibernate
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate ORM: auto-create/update tables from entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Jackson
# ==========================================================
spring.jackson.serialization.fail-on-empty-beans=false

# ==========================================================
# Async / Multithreading (used for order processing pipeline)
# ==========================================================
app.async.core-pool-size=5
app.async.max-pool-size=15
app.async.queue-capacity=100

# ==========================================================
# CORS (frontend is served separately as static HTML/JS)
# ==========================================================
app.cors.allowed-origins=*
