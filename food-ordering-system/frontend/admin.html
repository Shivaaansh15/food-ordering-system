<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forkful — Restaurant Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
    <a class="brand" href="admin.html">Fork<span>ful</span> <span style="font-size:13px; opacity:0.7;">Admin</span></a>
    <nav>
        <a href="#" onclick="Session.clear(); window.location='index.html';">Log out</a>
    </nav>
</div>

<div class="container">
    <h1>Restaurant dashboard</h1>
    <div id="error-banner" class="error-banner"></div>

    <!-- No restaurant yet: create one -->
    <div id="create-restaurant-card" class="card" style="display:none;">
        <h3>Create your restaurant</h3>
        <div class="form-row"><label>Name</label><input id="new-r-name"></div>
        <div class="form-row"><label>Cuisine type</label><input id="new-r-cuisine" placeholder="e.g. Italian, Indian, Fast food"></div>
        <div class="form-row"><label>Description</label><input id="new-r-desc"></div>
        <div class="form-row"><label>Address</label><input id="new-r-address"></div>
        <button onclick="createRestaurant()">Create restaurant</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h3 id="r-name"></h3>
                <span class="tag" id="r-status"></span>
            </div>
            <button class="secondary" id="toggle-active-btn" onclick="toggleActive()">Toggle open/closed</button>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-menu" onclick="switchTab('menu')">Menu</button>
            <button class="tab" id="tab-orders" onclick="switchTab('orders')">Incoming orders</button>
        </div>

        <!-- MENU TAB -->
        <div id="panel-menu">
            <div class="card">
                <h3>Add a food item</h3>
                <div class="form-row"><label>Name</label><input id="item-name"></div>
                <div class="form-row"><label>Description</label><input id="item-desc"></div>
                <div class="form-row"><label>Category</label><input id="item-category" placeholder="e.g. Starters, Mains, Desserts"></div>
                <div class="form-row"><label>Price</label><input id="item-price" type="number" step="0.01"></div>
                <button onclick="addMenuItem()">Add item</button>
            </div>
            <div id="menu-management"></div>
        </div>

        <!-- ORDERS TAB -->
        <div id="panel-orders" style="display:none;">
            <div id="orders-management"></div>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
Session.requireLogin();
if (Session.role !== "RESTAURANT_ADMIN") {
    window.location.href = "restaurants.html";
}

let myRestaurant = null;

async function init() {
    try {
        const mine = await apiCall("/restaurants/mine");
        if (mine.length === 0) {
            document.getElementById("create-restaurant-card").style.display = "block";
            return;
        }
        myRestaurant = mine[0];
        document.getElementById("dashboard").style.display = "block";
        renderRestaurantHeader();
        loadMenu();
        loadOrders();
    } catch (e) {
        showError(e.message);
    }
}

function renderRestaurantHeader() {
    document.getElementById("r-name").textContent = myRestaurant.name;
    const statusTag = document.getElementById("r-status");
    statusTag.textContent = myRestaurant.active ? "Open for orders" : "Closed";
    statusTag.className = "tag" + (myRestaurant.active ? "" : " closed");
}

async function createRestaurant() {
    try {
        myRestaurant = await apiCall("/restaurants", {
            method: "POST",
            body: {
                name: document.getElementById("new-r-name").value,
                cuisineType: document.getElementById("new-r-cuisine").value,
                description: document.getElementById("new-r-desc").value,
                address: document.getElementById("new-r-address").value
            }
        });
        document.getElementById("create-restaurant-card").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        renderRestaurantHeader();
        loadMenu();
        loadOrders();
    } catch (e) {
        showError(e.message);
    }
}

async function toggleActive() {
    try {
        myRestaurant = await apiCall(`/restaurants/${myRestaurant.id}/active?active=${!myRestaurant.active}`, { method: "PATCH" });
        renderRestaurantHeader();
    } catch (e) {
        showError(e.message);
    }
}

function switchTab(tab) {
    document.getElementById("tab-menu").classList.toggle("active", tab === "menu");
    document.getElementById("tab-orders").classList.toggle("active", tab === "orders");
    document.getElementById("panel-menu").style.display = tab === "menu" ? "block" : "none";
    document.getElementById("panel-orders").style.display = tab === "orders" ? "block" : "none";
    if (tab === "orders") loadOrders();
}

// ---- Menu management ----
async function addMenuItem() {
    try {
        await apiCall(`/restaurants/${myRestaurant.id}/menu`, {
            method: "POST",
            body: {
                name: document.getElementById("item-name").value,
                description: document.getElementById("item-desc").value,
                category: document.getElementById("item-category").value,
                price: parseFloat(document.getElementById("item-price").value || "0")
            }
        });
        ["item-name", "item-desc", "item-category", "item-price"].forEach(id => document.getElementById(id).value = "");
        loadMenu();
    } catch (e) {
        showError(e.message);
    }
}

async function loadMenu() {
    try {
        const items = await apiCall(`/restaurants/${myRestaurant.id}/menu/manage`);
        const el = document.getElementById("menu-management");
        if (items.length === 0) {
            el.innerHTML = '<div class="empty-state">No menu items yet. Add your first one above.</div>';
            return;
        }
        el.innerHTML = `
            <table class="card">
                <thead><tr><th>Item</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
                <tbody>
                    ${items.map(i => `
                        <tr>
                            <td>${escapeHtml(i.name)}</td>
                            <td>${escapeHtml(i.category || '—')}</td>
                            <td>
                                <input type="number" step="0.01" value="${i.price}" style="width:90px"
                                    onchange="updatePrice(${i.id}, this.value)">
                            </td>
                            <td>
                                <label style="display:flex; align-items:center; gap:6px;">
                                    <input type="checkbox" ${i.available ? "checked" : ""} onchange="toggleAvailability(${i.id}, this.checked)">
                                    ${i.available ? "In stock" : "Sold out"}
                                </label>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    } catch (e) {
        showError(e.message);
    }
}

async function updatePrice(itemId, price) {
    try {
        await apiCall(`/menu/${itemId}/price`, { method: "PATCH", body: { price: parseFloat(price) } });
    } catch (e) {
        showError(e.message);
        loadMenu();
    }
}

async function toggleAvailability(itemId, available) {
    try {
        await apiCall(`/menu/${itemId}/availability`, { method: "PATCH", body: { available } });
        loadMenu();
    } catch (e) {
        showError(e.message);
    }
}

// ---- Orders management ----
async function loadOrders() {
    if (!myRestaurant) return;
    try {
        const orders = await apiCall(`/orders/restaurant/${myRestaurant.id}`);
        const el = document.getElementById("orders-management");
        if (orders.length === 0) {
            el.innerHTML = '<div class="empty-state">No orders yet.</div>';
            return;
        }
        el.innerHTML = orders.map(o => `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Order #${o.id} — ${escapeHtml(o.customer.name)}</h3>
                    <span class="status-pill status-${o.status}">${o.status.replace(/_/g, ' ')}</span>
                </div>
                <p style="color:var(--muted); font-size:14px;">
                    ${o.items.map(i => `${i.quantity}× ${escapeHtml(i.menuItem.name)}`).join(", ")}
                </p>
                <p style="color:var(--muted); font-size:13px;">Deliver to: ${escapeHtml(o.deliveryAddress)}</p>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>${money(o.totalAmount)}</strong>
                    <div>${renderOrderActions(o)}</div>
                </div>
            </div>
        `).join("");
    } catch (e) {
        showError(e.message);
    }
}

function renderOrderActions(o) {
    switch (o.status) {
        case "PLACED":
            return `<button onclick="setStatus(${o.id}, 'ACCEPTED')">Accept</button>
                    <button class="secondary" onclick="setStatus(${o.id}, 'REJECTED')">Reject</button>`;
        case "ACCEPTED":
            return `<button onclick="setStatus(${o.id}, 'PREPARING')">Start preparing</button>`;
        case "PREPARING":
            return `<button onclick="setStatus(${o.id}, 'OUT_FOR_DELIVERY')">Out for delivery</button>`;
        case "OUT_FOR_DELIVERY":
            return `<button onclick="setStatus(${o.id}, 'DELIVERED')">Mark delivered</button>`;
        default:
            return "";
    }
}

async function setStatus(orderId, status) {
    try {
        await apiCall(`/orders/${orderId}/status`, { method: "PATCH", body: { status } });
        loadOrders();
    } catch (e) {
        showError(e.message);
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

init();
</script>
</body>
</html>
